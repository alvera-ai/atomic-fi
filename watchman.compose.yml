# Watchman config for the single-command `docker compose up` stack.
#
# Mirrors config.all-lists.yml (the native/local-dependencies flow), but with
# NO `Database:` block. moov/watchman v0.62.0 only requires PostgreSQL when a
# `Database.Postgres` block is present; omitting it makes Watchman use its
# built-in default storage and load every list into the in-memory search index
# at startup — no external DB, no `watchman` database to provision. The
# Download/Senzing/Ingest sections below are unchanged from config.all-lists.yml.
#
# Keep this in sync with config.all-lists.yml's list sources (the only
# intentional difference is the dropped Database block).
Watchman:
  Servers:
    BindAddress: ":8084"
    AdminAddress: ":9094"

  Telemetry:
    ServiceName: "watchman"

  Webui:
    BasePath: "/"

  Download:
    RefreshInterval: "12h"
    InitialDataDirectory: "/data"

    IncludedLists:
      - us_ofac
      - us_csl
      - us_non_sdn
      - us_fincen_311
      - un_csl

    # Country-specific OpenSanctions datasets in Senzing format. Loaded into the
    # in-memory search index at startup. The file is provided locally at
    # InitialDataDirectory/<SourceList> (/data/id_dttot, populated by the
    # `hydrate` service), so Watchman matches it by name and never downloads.
    Senzing:
      - SourceList: id_dttot
      # US restricted-party lists that the lists above do not carry, rebuilt daily
      # from the official sources (DoD Federal Register notice, DHS, FCC, eCFR) by
      # https://github.com/Mattbusel/us-restricted-parties. Watchman downloads them
      # from Location and refreshes them on RefreshInterval like the lists above.
      # A file named after the SourceList in InitialDataDirectory overrides the URL.
      # DoD 1260H Chinese military companies, each named subsidiary as its own record
      - SourceList: us_dod_1260h
        Location: "https://github.com/Mattbusel/us-restricted-parties/releases/latest/download/us_dod_1260h.jsonl"
      # DHS UFLPA Entity List (forced-labor import ban)
      - SourceList: us_dhs_uflpa
        Location: "https://github.com/Mattbusel/us-restricted-parties/releases/latest/download/us_dhs_uflpa.jsonl"
      # FCC Covered List, named companies
      - SourceList: us_fcc_covered
        Location: "https://github.com/Mattbusel/us-restricted-parties/releases/latest/download/us_fcc_covered.jsonl"
      # Section 889 covered telecom and video surveillance companies (48 CFR 52.204-25)
      - SourceList: us_far_889
        Location: "https://github.com/Mattbusel/us-restricted-parties/releases/latest/download/us_far_889.jsonl"
      # Companies that listed parties (SDN, Entity List, the lists above) own 50% or
      # more, or possibly so, under the OFAC 50 Percent Rule and BIS Affiliates Rule,
      # from GLEIF ownership data. Evidence for review, not an agency listing.
      - SourceList: us_restricted_affiliates
        Location: "https://github.com/Mattbusel/us-restricted-parties/releases/latest/download/affiliates.covered.senzing.jsonl"

  Search:
    Goroutines:
      Default: 10
      Min: 1
      Max: 25

  Ingest:
    Files:
      custom_watchlist:
        Format: "senzing-jsonl"

  Geocoding:
    Enabled: false
    Provider:
      Name: "opencage"
      APIKey: ""
      BaseURL: ""
      Timeout: "10s"
    RateLimit:
      RequestsPerSecond: 1
      Burst: 5
    Cache:
      L1MaxSize: 10000
      L1TTL: "24h"
      L2Enabled: false
